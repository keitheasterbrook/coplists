openapi: 3.1.0
info:
  title: Coplist API
  version: 0.1.0
  description: |
    HTTP API for Coplist, a shared shopping-list web app. Stories are referenced by ID
    (e.g. `LIST-01`) from `user-stories.md`; architecture rules are in `CLAUDE.md`.

    ## Access
    The web app calls the API at `/api/...` on its own domain; CloudFront forwards `/api/*`
    to the HTTP API. Every route except `GET /api/health` needs a Cognito access token with
    the `coplist/api` scope, checked by API Gateway's JWT authorizer. List access is checked
    per request against the caller's role on the list (see Roles in `user-stories.md`):

    - not signed in, or token invalid or expired → `401` (API Gateway's own body)
    - signed in but no user record (removed by a system admin) → `401` `UNAUTHORIZED`
    - not a member of the list and not a system admin → `404`, exactly as if the list didn't exist
    - a member whose role doesn't allow the action → `403` `FORBIDDEN`
    - demoting, removing, or leaving as the primary list admin → `400` `PRIMARY_ADMIN_LOCKED`

    ## Errors
    Every non-2xx response from the API has the body `{ "error": { "code", "message" } }`.
    Clients branch on `code`, never on `message`. The exceptions are the `401` and `429`
    responses API Gateway returns itself before any Lambda runs; those have API Gateway's
    own body (`{ "message": "..." }`), so clients handle them by status code.

    ## Changes and conflicts
    - IDs of new lists, items, and groups are UUIDs generated by the client. Creating an
      entity that already exists returns it with `200`, so resending a create is harmless.
    - Every write to a list, item, or group carries `changedAt`: when the change was made on
      the device, corrected by the device's clock offset from the server (learned from the
      `X-Server-Time` header on every response). The server clamps a `changedAt` in the
      future to its own clock.
    - The latest change wins, field by field: the server applies each field of a change
      only if its `changedAt` is later than that field's stored timestamp
      (`fieldUpdatedAt`), ignores the rest, and returns the resulting entity. There are no
      `409` conflicts.
    - Removing is final. A removed item, group, or list leaves a tombstone for 30 days;
      later changes to it get `404`. Undo of an item removal uses the restore endpoint.

    ## Polling
    The app polls every 5 seconds while a screen is visible and online: `GET /api/lists/{listId}`
    for an open list (with `If-None-Match`, answered with `304` when nothing changed) and
    `GET /api/lists` for the lists screen.

    ## Text lengths
    Length limits count user-perceived characters (grapheme clusters), not UTF-16 code
    units, so an emoji counts as one. They're given as `x-max-graphemes` because JSON
    Schema's `maxLength` counts code points. `minLength: 1` applies after trimming.
servers:
  - url: https://dev.coplists.com
    description: dev
security:
  - cognitoJwt: [coplist/api]
tags:
  - name: Health
    description: SETUP-01
  - name: Me
    description: The signed-in user
  - name: Lists
    description: LIST-01 – LIST-04, SYNC-01
  - name: Items
    description: ITEM-01 – ITEM-11
  - name: Groups
    description: GROUP-01 – GROUP-07
  - name: Members
    description: SHARE-03 – SHARE-05
  - name: Invites
    description: SHARE-01, SHARE-02
  - name: Templates
    description: ADMIN-01, GROUP-02
  - name: Admin
    description: ADMIN-02, ADMIN-03 (system admins only)

paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Health check (SETUP-01)
      description: The only route without the JWT authorizer.
      security: []
      responses:
        '200':
          description: The API is up.
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /api/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: The signed-in user
      responses:
        '200':
          description: The caller's user record.
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lists:
    get:
      tags: [Lists]
      operationId: listMyLists
      summary: Lists I'm a member of (LIST-02)
      description: |
        Every list the caller is a list user or list admin of, most recently updated first.
        Polled every 5 seconds on the lists screen (SYNC-01). Not paginated: a user's own
        lists are few. System admins see all lists through `GET /api/admin/lists`.
      responses:
        '200':
          description: The caller's lists.
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
          content:
            application/json:
              schema:
                type: object
                required: [lists]
                properties:
                  lists:
                    type: array
                    items:
                      $ref: '#/components/schemas/ListSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Lists]
      operationId: createList
      summary: Create a list (LIST-01, GROUP-02)
      description: |
        The caller becomes the list's primary list admin. With `templateId`, the list gets a
        copy of the template's groups and items (all unchecked), with IDs generated by the
        server; creating from a template therefore needs a connection. Without it, the list
        is empty and can be created offline and sent later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListRequest'
      responses:
        '201':
          description: Created.
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDetail'
        '200':
          description: A list with this ID already exists and the caller created it (resent create).
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`TEMPLATE_NOT_FOUND`, or `LIST_NOT_FOUND` if the ID belongs to a list that was deleted.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lists/{listId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      tags: [Lists]
      operationId: getList
      summary: A list with its groups, items, and tombstones (SYNC-01)
      description: |
        Polled every 5 seconds while the list is open. Send the last `ETag` as
        `If-None-Match`; when the list's `revision` hasn't changed, the answer is `304` after
        reading only the list record. A `404` means the list was deleted or the caller lost
        access; the app returns to the lists screen with "This list is no longer available".
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: The `ETag` from the previous response.
      responses:
        '200':
          description: The list's current state.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDetail'
        '304':
          description: Nothing has changed since the `If-None-Match` revision.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Lists]
      operationId: renameList
      summary: Rename a list (LIST-03)
      description: List admins and system admins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListRequest'
      responses:
        '200':
          $ref: '#/components/responses/ListOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Lists]
      operationId: deleteList
      summary: Delete a list (LIST-04)
      description: |
        Only the primary list admin or a system admin. Deletes the list's items, groups,
        memberships, and pending invites. Online only: the app doesn't queue it offline.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lists/{listId}/items:
    parameters:
      - $ref: '#/components/parameters/ListId'
    post:
      tags: [Items]
      operationId: createItem
      summary: Add an item (ITEM-01)
      description: |
        The new item is active and unchecked. The client sets `position` to a
        fractional-index key after the last item in the item's group (or the ungrouped
        items), so it appears at the bottom.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '201':
          $ref: '#/components/responses/ItemCreated'
        '200':
          $ref: '#/components/responses/ItemOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lists/{listId}/items/clear-checked:
    parameters:
      - $ref: '#/components/parameters/ListId'
    post:
      tags: [Items]
      operationId: clearCheckedItems
      summary: Clear checked items (ITEM-05)
      description: |
        Makes the given items inactive and unchecked. The client sends the IDs of the items
        it showed as checked, so an item someone else checks afterwards isn't cleared.
        Each field follows the latest-change-wins rule; IDs of items that were removed are
        skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearCheckedRequest'
      responses:
        '200':
          description: The resulting items.
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lists/{listId}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/ItemId'
    patch:
      tags: [Items]
      operationId: updateItem
      summary: Change an item (ITEM-02, ITEM-03, ITEM-08, ITEM-11, GROUP-03)
      description: |
        One endpoint for every item change: check or uncheck, edit, activate or inactivate,
        move (`position`), or change group. Send only the fields that changed. Each field is
        applied only if `changedAt` is later than that field's stored timestamp; the
        response is the resulting item, whichever fields won.

        Rules: `checked: true` is rejected on an inactive item. Setting `active` to either
        value also sets `checked: false`. Moving to another group should come with a
        `position` at the bottom of that group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
      responses:
        '200':
          $ref: '#/components/responses/ItemOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Items]
      operationId: removeItem
      summary: Remove an item (ITEM-04)
      description: Removes the item for good and leaves a tombstone. Undo uses `POST .../restore`.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lists/{listId}/items/{itemId}/restore:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [Items]
      operationId: restoreItem
      summary: Undo removing an item (ITEM-04)
      description: |
        Brings back a removed item with the details it had, in its original position.
        Restoring an item that isn't removed returns it unchanged. `404` if the item never
        existed or its tombstone has expired.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreItemRequest'
      responses:
        '200':
          $ref: '#/components/responses/ItemOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lists/{listId}/groups:
    parameters:
      - $ref: '#/components/parameters/ListId'
    post:
      tags: [Groups]
      operationId: createGroup
      summary: Add a group (GROUP-01)
      description: |
        List admins and system admins. The client sets `position` after the last group so
        the new group is at the bottom. Names are unique within the list, ignoring case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          $ref: '#/components/responses/GroupCreated'
        '200':
          $ref: '#/components/responses/GroupOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lists/{listId}/groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/GroupId'
    patch:
      tags: [Groups]
      operationId: updateGroup
      summary: Rename or move a group (GROUP-05, GROUP-06)
      description: List admins and system admins. Latest change wins, per field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          $ref: '#/components/responses/GroupOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Groups]
      operationId: deleteGroup
      summary: Delete a group (GROUP-07)
      description: |
        List admins and system admins. The group's items are never deleted: they become
        ungrouped and keep their details and their active and checked state.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lists/{listId}/members:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      tags: [Members]
      operationId: listMembers
      summary: A list's members and their roles (SHARE-03)
      responses:
        '200':
          description: The members.
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lists/{listId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Members]
      operationId: changeMemberRole
      summary: Promote or demote a member (SHARE-03)
      description: |
        List admins and system admins. A list admin may demote themselves. The primary list
        admin can't be demoted (`400` `PRIMARY_ADMIN_LOCKED`). Online only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/ListRole'
      responses:
        '200':
          description: The member with their new role.
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Remove someone from a list (SHARE-04)
      description: |
        List admins and system admins. The primary list admin can't be removed
        (`400` `PRIMARY_ADMIN_LOCKED`). Items the member added stay. Online only.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lists/{listId}/leave:
    parameters:
      - $ref: '#/components/parameters/ListId'
    post:
      tags: [Members]
      operationId: leaveList
      summary: Leave a list (SHARE-05)
      description: |
        Any member except the primary list admin (`400` `PRIMARY_ADMIN_LOCKED`), who can
        delete the list instead. Rejoining needs a new invite. Online only.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lists/{listId}/invites:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      tags: [Invites]
      operationId: listListInvites
      summary: A list's pending invites (SHARE-01)
      description: List admins and system admins.
      responses:
        '200':
          description: Pending invites, with each invite email's delivery status.
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Invites]
      operationId: inviteToList
      summary: Invite someone by email (SHARE-01)
      description: |
        List admins and system admins. The invite is created at once; the email is sent
        afterwards through SES, and its result shows in `deliveryStatus`. The invitee
        doesn't need an account yet. Each user can send at most 20 invites in any 24 hours
        (`429` `INVITE_LIMIT_REACHED`, with the normal error body). Online only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  $ref: '#/components/schemas/Email'
      responses:
        '201':
          description: 'Invite created; email not sent yet (`deliveryStatus: pending`).'
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          description: '`VALIDATION_ERROR`, `ALREADY_MEMBER`, or `INVITE_ALREADY_PENDING`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lists/{listId}/invites/{inviteId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/InviteId'
    delete:
      tags: [Invites]
      operationId: cancelInvite
      summary: Cancel a pending invite (SHARE-01)
      description: List admins and system admins. A canceled invite can't be accepted.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/invites:
    get:
      tags: [Invites]
      operationId: listMyInvites
      summary: My pending invites (SHARE-02)
      description: Invites whose email matches the caller's verified email address.
      responses:
        '200':
          description: The caller's pending invites.
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyInvite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/invites/{inviteId}/accept:
    parameters:
      - $ref: '#/components/parameters/InviteId'
    post:
      tags: [Invites]
      operationId: acceptInvite
      summary: Accept an invite (SHARE-02)
      description: |
        Allowed only when the invite's email matches the caller's verified email; otherwise
        `404` `INVITE_NOT_FOUND`. The caller becomes a list user. Online only.
      responses:
        '200':
          description: The list the caller just joined.
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/invites/{inviteId}/reject:
    parameters:
      - $ref: '#/components/parameters/InviteId'
    post:
      tags: [Invites]
      operationId: rejectInvite
      summary: Reject an invite (SHARE-02)
      description: Same access rule as accepting. The invite is removed. Online only.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/templates:
    get:
      tags: [Templates]
      operationId: listTemplates
      summary: All list templates (GROUP-02, ADMIN-01)
      description: Any signed-in user, to choose one when creating a list.
      responses:
        '200':
          description: Template summaries, by name.
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/TemplateSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Templates]
      operationId: createTemplate
      summary: Create a template (ADMIN-01)
      description: System admins only. Names are unique, ignoring case (`400` `TEMPLATE_NAME_TAKEN`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateInput'
      responses:
        '201':
          $ref: '#/components/responses/TemplateOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    get:
      tags: [Templates]
      operationId: getTemplate
      summary: A template with its groups and items (ADMIN-01)
      description: Any signed-in user.
      responses:
        '200':
          $ref: '#/components/responses/TemplateOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Templates]
      operationId: replaceTemplate
      summary: Replace a template (ADMIN-01)
      description: |
        System admins only. Replaces the name, groups, and items in one request. Lists
        already created from the template don't change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateInput'
      responses:
        '200':
          $ref: '#/components/responses/TemplateOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Templates]
      operationId: deleteTemplate
      summary: Delete a template (ADMIN-01)
      description: System admins only. Lists already created from it don't change.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: All users (ADMIN-02)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of users.
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  nextCursor:
                    $ref: '#/components/schemas/NextCursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Admin]
      operationId: addUser
      summary: Add a user by email (ADMIN-02)
      description: |
        Creates the Cognito user, which emails them a temporary password, and creates their
        user record (the post-confirmation trigger doesn't run for admin-created users).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  $ref: '#/components/schemas/Email'
      responses:
        '201':
          description: The new user.
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: '`VALIDATION_ERROR` or `USER_ALREADY_EXISTS`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Admin]
      operationId: setSystemAdmin
      summary: Grant or remove system admin rights (ADMIN-02)
      description: A system admin can't change their own rights (`400` `CANNOT_CHANGE_OWN_ADMIN`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [isSystemAdmin]
              properties:
                isSystemAdmin:
                  type: boolean
      responses:
        '200':
          description: The updated user.
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Admin]
      operationId: removeUser
      summary: Remove a user (ADMIN-02)
      description: |
        Deletes the Cognito user and their user record, so the API rejects their requests at
        once (`401`) even with an unexpired token. Removes their memberships and pending
        invites, and deletes every list they're primary list admin of. A system admin can't
        remove themselves (`400` `CANNOT_REMOVE_SELF`). Call `GET .../removal-impact` first
        to show what will be deleted.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/users/{userId}/removal-impact:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin]
      operationId: getUserRemovalImpact
      summary: What removing a user would delete (ADMIN-02)
      responses:
        '200':
          description: Counts to show before the system admin confirms.
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
          content:
            application/json:
              schema:
                type: object
                required: [listsToDelete, otherMembersAffected]
                properties:
                  listsToDelete:
                    type: integer
                    minimum: 0
                    description: Lists the user is primary list admin of.
                  otherMembersAffected:
                    type: integer
                    minimum: 0
                    description: Distinct other members of those lists.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/lists:
    get:
      tags: [Admin]
      operationId: listAllLists
      summary: Every list in the system (ADMIN-03)
      description: |
        For the admin view. A system admin then uses the ordinary list endpoints on any of
        these lists, with list-admin rights plus delete.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of lists.
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
          content:
            application/json:
              schema:
                type: object
                required: [lists]
                properties:
                  lists:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminListSummary'
                  nextCursor:
                    $ref: '#/components/schemas/NextCursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    cognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Cognito user pool access token from managed login (authorization code + PKCE),
        with the `coplist/api` scope. Checked by API Gateway's JWT authorizer (issuer: the
        user pool; audience: the web app client ID).

  headers:
    X-Server-Time:
      description: The server's clock, for the client's clock-offset correction of `changedAt`.
      schema:
        type: string
        format: date-time
    ETag:
      description: The list's `revision`, quoted. Send it back as `If-None-Match`.
      schema:
        type: string
        examples: ['"42"']

  parameters:
    ListId:
      name: listId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    UserId:
      name: userId
      in: path
      required: true
      description: The user's Cognito `sub`.
      schema:
        $ref: '#/components/schemas/UserId'
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `nextCursor` from the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  responses:
    NoContent:
      description: Done.
      headers:
        X-Server-Time:
          $ref: '#/components/headers/X-Server-Time'
    ListOk:
      description: The resulting list.
      headers:
        X-Server-Time:
          $ref: '#/components/headers/X-Server-Time'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/List'
    ItemCreated:
      description: Created.
      headers:
        X-Server-Time:
          $ref: '#/components/headers/X-Server-Time'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Item'
    ItemOk:
      description: The resulting item (for a create, it already existed).
      headers:
        X-Server-Time:
          $ref: '#/components/headers/X-Server-Time'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Item'
    GroupCreated:
      description: Created.
      headers:
        X-Server-Time:
          $ref: '#/components/headers/X-Server-Time'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Group'
    GroupOk:
      description: The resulting group (for a create, it already existed).
      headers:
        X-Server-Time:
          $ref: '#/components/headers/X-Server-Time'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Group'
    TemplateOk:
      description: The template.
      headers:
        X-Server-Time:
          $ref: '#/components/headers/X-Server-Time'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Template'
    BadRequest:
      description: |
        `VALIDATION_ERROR`, or a rule violation such as `PRIMARY_ADMIN_LOCKED`,
        `GROUP_NAME_TAKEN`, `TEMPLATE_NAME_TAKEN`, `ITEM_INACTIVE`,
        `CANNOT_CHANGE_OWN_ADMIN`, or `CANNOT_REMOVE_SELF`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: |
        No valid token (API Gateway's body), or a valid token for a user who has been
        removed (`UNAUTHORIZED`). The app sends the user to sign in.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ApiError'
              - $ref: '#/components/schemas/GatewayError'
    Forbidden:
      description: '`FORBIDDEN`: the caller is a member, but their role doesn''t allow this.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: |
        The resource doesn't exist, was removed, or the caller has no access to its list.
        Code: `LIST_NOT_FOUND`, `ITEM_NOT_FOUND`, `GROUP_NOT_FOUND`, `MEMBER_NOT_FOUND`,
        `INVITE_NOT_FOUND`, `TEMPLATE_NOT_FOUND`, or `USER_NOT_FOUND`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: |
        Throttled by API Gateway (its own body; retry shortly), or `INVITE_LIMIT_REACHED`
        (normal error body).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ApiError'
              - $ref: '#/components/schemas/GatewayError'
    InternalError:
      description: '`INTERNAL_ERROR` with a generic message; details go to the logs.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    Id:
      type: string
      format: uuid
    UserId:
      type: string
      description: A Cognito `sub`.
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601, UTC, millisecond precision.
    ChangedAt:
      allOf:
        - $ref: '#/components/schemas/Timestamp'
      description: When the change was made on the device, corrected for clock offset.
    Position:
      type: string
      minLength: 1
      description: A fractional-index key (`fractional-indexing` package). Sorts as a plain string.
    Email:
      type: string
      format: email
      maxLength: 254
    NextCursor:
      type: [string, 'null']
      description: Pass as `cursor` for the next page; `null` on the last page.

    ListName:
      type: string
      minLength: 1
      x-max-graphemes: 50
      description: 1–50 characters after trimming (LIST-01).
    ItemName:
      type: string
      minLength: 1
      x-max-graphemes: 100
      description: 1–100 characters after trimming (ITEM-01).
    ItemQuantity:
      type: [string, 'null']
      x-max-graphemes: 30
      description: Free text, e.g. "2" or "1 lb". Optional. Limit proposed; not yet in the stories.
    ItemNote:
      type: [string, 'null']
      x-max-graphemes: 500
      description: Optional. Limit proposed; not yet in the stories.
    GroupName:
      type: string
      minLength: 1
      x-max-graphemes: 30
      description: 1–30 characters after trimming; unique within the list, ignoring case (GROUP-01).
    TemplateName:
      type: string
      minLength: 1
      x-max-graphemes: 50
      description: 1–50 characters after trimming; unique, ignoring case (ADMIN-01).

    ListRole:
      type: string
      enum: [listAdmin, listUser]

    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - LIST_NOT_FOUND
        - ITEM_NOT_FOUND
        - GROUP_NOT_FOUND
        - MEMBER_NOT_FOUND
        - INVITE_NOT_FOUND
        - TEMPLATE_NOT_FOUND
        - USER_NOT_FOUND
        - PRIMARY_ADMIN_LOCKED
        - ITEM_INACTIVE
        - GROUP_NAME_TAKEN
        - TEMPLATE_NAME_TAKEN
        - ALREADY_MEMBER
        - INVITE_ALREADY_PENDING
        - INVITE_LIMIT_REACHED
        - USER_ALREADY_EXISTS
        - CANNOT_CHANGE_OWN_ADMIN
        - CANNOT_REMOVE_SELF
        - INTERNAL_ERROR
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
      examples:
        - error:
            code: LIST_NOT_FOUND
            message: List not found
    GatewayError:
      type: object
      description: The body API Gateway uses for its own 401 and 429 responses.
      required: [message]
      properties:
        message:
          type: string
      examples:
        - message: Unauthorized

    User:
      type: object
      required: [id, email, isSystemAdmin]
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        email:
          $ref: '#/components/schemas/Email'
        isSystemAdmin:
          type: boolean

    ListSummary:
      type: object
      description: One row of the lists screen (LIST-02).
      required: [id, name, activeUncheckedCount, updatedAt, role, isPrimaryAdmin]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/ListName'
        activeUncheckedCount:
          type: integer
          minimum: 0
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        role:
          $ref: '#/components/schemas/ListRole'
        isPrimaryAdmin:
          type: boolean
    AdminListSummary:
      type: object
      required: [id, name, primaryAdminEmail, memberCount, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/ListName'
        primaryAdminEmail:
          $ref: '#/components/schemas/Email'
        memberCount:
          type: integer
          minimum: 1
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    ChangeMeta:
      type: object
      description: Who made the latest applied change, and when (ITEM-10).
      required: [version, updatedAt, updatedBy, updatedByEmail]
      properties:
        version:
          type: integer
          minimum: 1
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        updatedBy:
          $ref: '#/components/schemas/UserId'
        updatedByEmail:
          type: [string, 'null']
          format: email
          description: '`null` when that user has been removed ("Last changed by a removed user").'

    List:
      allOf:
        - $ref: '#/components/schemas/ChangeMeta'
        - type: object
          required: [id, name, primaryAdminId, revision, activeUncheckedCount, myRole, isPrimaryAdmin, fieldUpdatedAt]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            name:
              $ref: '#/components/schemas/ListName'
            primaryAdminId:
              $ref: '#/components/schemas/UserId'
            revision:
              type: integer
              minimum: 1
              description: Incremented by every change to the list, its items, or its groups; the `ETag`.
            activeUncheckedCount:
              type: integer
              minimum: 0
            myRole:
              description: The caller's role; `null` for a system admin who isn't a member.
              oneOf:
                - $ref: '#/components/schemas/ListRole'
                - type: 'null'
            isPrimaryAdmin:
              type: boolean
            fieldUpdatedAt:
              type: object
              required: [name]
              properties:
                name:
                  $ref: '#/components/schemas/Timestamp'

    Item:
      allOf:
        - $ref: '#/components/schemas/ChangeMeta'
        - type: object
          required: [id, listId, name, quantity, note, groupId, active, checked, position, fieldUpdatedAt]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            listId:
              $ref: '#/components/schemas/Id'
            name:
              $ref: '#/components/schemas/ItemName'
            quantity:
              $ref: '#/components/schemas/ItemQuantity'
            note:
              $ref: '#/components/schemas/ItemNote'
            groupId:
              description: '`null` when ungrouped.'
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
            active:
              type: boolean
            checked:
              type: boolean
              description: Always `false` when `active` is `false`.
            position:
              $ref: '#/components/schemas/Position'
            fieldUpdatedAt:
              type: object
              required: [name, quantity, note, groupId, active, checked, position]
              properties:
                name:
                  $ref: '#/components/schemas/Timestamp'
                quantity:
                  $ref: '#/components/schemas/Timestamp'
                note:
                  $ref: '#/components/schemas/Timestamp'
                groupId:
                  $ref: '#/components/schemas/Timestamp'
                active:
                  $ref: '#/components/schemas/Timestamp'
                checked:
                  $ref: '#/components/schemas/Timestamp'
                position:
                  $ref: '#/components/schemas/Timestamp'

    Group:
      allOf:
        - $ref: '#/components/schemas/ChangeMeta'
        - type: object
          required: [id, listId, name, position, fieldUpdatedAt]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            listId:
              $ref: '#/components/schemas/Id'
            name:
              $ref: '#/components/schemas/GroupName'
            position:
              $ref: '#/components/schemas/Position'
            fieldUpdatedAt:
              type: object
              required: [name, position]
              properties:
                name:
                  $ref: '#/components/schemas/Timestamp'
                position:
                  $ref: '#/components/schemas/Timestamp'

    Tombstone:
      type: object
      description: A removed item or group, kept for 30 days so clients can drop it from their offline copy.
      required: [entityType, id, deletedAt]
      properties:
        entityType:
          type: string
          enum: [item, group]
        id:
          $ref: '#/components/schemas/Id'
        deletedAt:
          $ref: '#/components/schemas/Timestamp'

    ListDetail:
      type: object
      required: [list, groups, items, tombstones]
      properties:
        list:
          $ref: '#/components/schemas/List'
        groups:
          type: array
          description: Sorted by `position`, then `id`.
          items:
            $ref: '#/components/schemas/Group'
        items:
          type: array
          description: Sorted by `position`, then `id`.
          items:
            $ref: '#/components/schemas/Item'
        tombstones:
          type: array
          items:
            $ref: '#/components/schemas/Tombstone'

    CreateListRequest:
      type: object
      additionalProperties: false
      required: [id, name, changedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/ListName'
        changedAt:
          $ref: '#/components/schemas/ChangedAt'
        templateId:
          $ref: '#/components/schemas/Id'
    UpdateListRequest:
      type: object
      additionalProperties: false
      required: [name, changedAt]
      properties:
        name:
          $ref: '#/components/schemas/ListName'
        changedAt:
          $ref: '#/components/schemas/ChangedAt'

    CreateItemRequest:
      type: object
      additionalProperties: false
      required: [id, name, position, changedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/ItemName'
        quantity:
          $ref: '#/components/schemas/ItemQuantity'
        note:
          $ref: '#/components/schemas/ItemNote'
        groupId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        position:
          $ref: '#/components/schemas/Position'
        changedAt:
          $ref: '#/components/schemas/ChangedAt'
    UpdateItemRequest:
      type: object
      additionalProperties: false
      required: [changedAt]
      minProperties: 2
      description: '`changedAt` plus at least one field. `null` clears `quantity`, `note`, or `groupId`.'
      properties:
        changedAt:
          $ref: '#/components/schemas/ChangedAt'
        name:
          $ref: '#/components/schemas/ItemName'
        quantity:
          $ref: '#/components/schemas/ItemQuantity'
        note:
          $ref: '#/components/schemas/ItemNote'
        groupId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        active:
          type: boolean
        checked:
          type: boolean
        position:
          $ref: '#/components/schemas/Position'
    RestoreItemRequest:
      type: object
      additionalProperties: false
      description: The item as it was before removal, from the client's copy.
      required: [name, quantity, note, groupId, active, checked, position, changedAt]
      properties:
        name:
          $ref: '#/components/schemas/ItemName'
        quantity:
          $ref: '#/components/schemas/ItemQuantity'
        note:
          $ref: '#/components/schemas/ItemNote'
        groupId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        active:
          type: boolean
        checked:
          type: boolean
        position:
          $ref: '#/components/schemas/Position'
        changedAt:
          $ref: '#/components/schemas/ChangedAt'
    ClearCheckedRequest:
      type: object
      additionalProperties: false
      required: [itemIds, changedAt]
      properties:
        itemIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
        changedAt:
          $ref: '#/components/schemas/ChangedAt'

    CreateGroupRequest:
      type: object
      additionalProperties: false
      required: [id, name, position, changedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/GroupName'
        position:
          $ref: '#/components/schemas/Position'
        changedAt:
          $ref: '#/components/schemas/ChangedAt'
    UpdateGroupRequest:
      type: object
      additionalProperties: false
      required: [changedAt]
      minProperties: 2
      properties:
        changedAt:
          $ref: '#/components/schemas/ChangedAt'
        name:
          $ref: '#/components/schemas/GroupName'
        position:
          $ref: '#/components/schemas/Position'

    Member:
      type: object
      required: [userId, email, role, isPrimaryAdmin]
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        email:
          $ref: '#/components/schemas/Email'
        role:
          $ref: '#/components/schemas/ListRole'
        isPrimaryAdmin:
          type: boolean

    Invite:
      type: object
      description: A pending invite, as a list admin sees it.
      required: [id, listId, email, invitedBy, invitedByEmail, createdAt, deliveryStatus]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        listId:
          $ref: '#/components/schemas/Id'
        email:
          $ref: '#/components/schemas/Email'
        invitedBy:
          $ref: '#/components/schemas/UserId'
        invitedByEmail:
          $ref: '#/components/schemas/Email'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        deliveryStatus:
          type: string
          enum: [pending, sent, failed]
          description: '`failed` shows as "email not delivered".'
    MyInvite:
      type: object
      description: A pending invite, as the invitee sees it.
      required: [id, listId, listName, invitedByEmail, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        listId:
          $ref: '#/components/schemas/Id'
        listName:
          $ref: '#/components/schemas/ListName'
        invitedByEmail:
          $ref: '#/components/schemas/Email'
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    TemplateSummary:
      type: object
      required: [id, name, groupCount, itemCount, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/TemplateName'
        groupCount:
          type: integer
          minimum: 0
        itemCount:
          type: integer
          minimum: 0
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    TemplateGroup:
      type: object
      additionalProperties: false
      required: [id, name, position]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/GroupName'
        position:
          $ref: '#/components/schemas/Position'
    TemplateItem:
      type: object
      additionalProperties: false
      required: [id, name, groupId, active, position]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/ItemName'
        quantity:
          $ref: '#/components/schemas/ItemQuantity'
        note:
          $ref: '#/components/schemas/ItemNote'
        groupId:
          description: One of the template's groups, or `null`.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        active:
          type: boolean
        position:
          $ref: '#/components/schemas/Position'
    TemplateInput:
      type: object
      additionalProperties: false
      required: [name, groups, items]
      properties:
        name:
          $ref: '#/components/schemas/TemplateName'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/TemplateGroup'
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemplateItem'
    Template:
      type: object
      required: [id, name, groups, items, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/TemplateName'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/TemplateGroup'
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemplateItem'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
